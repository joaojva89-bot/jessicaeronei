<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jéssica & Rônei · 12.02.2027</title>
<meta name="description" content="Convite de casamento de Jéssica & Rônei">
<meta name="theme-color" content="#f6ece0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --marsala:#7a1f2b; --ouro:#b8863b; --creme:#f6ece0; --texto:#5a3b32; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at top,#fbf4ea 0%,var(--creme) 60%,#efe0cf 100%);
    color:var(--texto); font-family:'Cormorant Garamond',Georgia,serif;
    min-height:100vh; overflow-x:hidden; -webkit-tap-highlight-color:transparent;
  }

  /* ---------- Abertura: carta com selo ---------- */
  #abertura{
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#fbe6d1 0%,#fceee0 50%,#fcefe1 100%);
    overflow:hidden; cursor:pointer; transition:opacity .9s ease .1s, visibility .9s .1s;
  }
  #abertura.fim{opacity:0; visibility:hidden}
  .carta{
    position:relative; width:min(100vw, calc(100svh * 941 / 1671)); aspect-ratio:941/1671;
    perspective:1400px; transform-origin:51% 14%;
    transition:transform 1.3s cubic-bezier(.55,0,.25,1), filter 1.3s ease;
  }
  .carta img{position:absolute; display:block; user-select:none; -webkit-user-drag:none; pointer-events:none}
  .carta .base{inset:0; width:100%; height:100%}
  .carta .aba{left:27.099%; top:0; width:52.816%; height:23.459%; transform-origin:50% 0;
    transition:transform 1.1s cubic-bezier(.45,0,.2,1) .45s, opacity .35s ease 1.15s; filter:drop-shadow(0 4px 6px rgba(90,59,50,.18))}
  .carta .selo{left:40.383%; top:12.567%; width:22.848%; height:12.567%; animation:respira 2.4s ease-in-out infinite}
  .carta .clique{left:41.977%; top:20.467%; width:25.186%; height:5.147%; transition:opacity .35s ease}
  .brilho{position:absolute; left:51.75%; top:18.9%; width:22%; aspect-ratio:1; transform:translate(-50%,-50%);
    border-radius:50%; border:2px solid rgba(214,168,90,.55); animation:onda 2.4s ease-out infinite; pointer-events:none}

  /* sequência ao tocar */
  .abrindo .brilho{display:none}
  .abrindo .clique{opacity:0}
  .abrindo .selo{animation:quebra .75s cubic-bezier(.3,0,.2,1) forwards}
  .abrindo .aba{transform:rotateX(165deg); opacity:0}
  .abrindo .carta{transform:scale(1.9) translateY(6%); filter:blur(1px); transition-delay:1.35s}

  @keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  @keyframes quebra{
    0%{transform:scale(1) rotate(0); opacity:1; filter:brightness(1)}
    25%{transform:scale(1.14) rotate(-4deg); filter:brightness(1.25)}
    100%{transform:scale(.4) rotate(25deg) translateY(60%); opacity:0; filter:brightness(1.1)}
  }

  /* ---------- Páginas ---------- */
  body{overflow:hidden; overscroll-behavior:none}
  #paginas{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center,#f6e6d3 0%,#ead6bf 100%)}
  #livro{margin:0 auto}
  .pagina{background:#fcefe1; overflow:hidden}
  .quadro{position:relative; width:100%; height:100%; overflow:hidden}
  .quadro img{position:absolute; display:block; user-select:none; -webkit-user-drag:none}
  .quadro .fundo{inset:0; width:100%; height:100%; opacity:0; transform:scale(1.06); filter:blur(6px);
    transition:opacity 1.4s ease, transform 2.6s cubic-bezier(.2,.6,.2,1), filter 1.4s ease}
  .visivel .fundo{opacity:1; transform:none; filter:none}
  .pronta .fundo{opacity:1; transform:none; filter:none; transition:none}

  /* texto "sendo escrito": revela da esquerda pra direita */
  .escreve{opacity:0; clip-path:inset(0 100% 0 0); transition:clip-path 1.1s cubic-bezier(.5,0,.3,1), opacity .5s ease}
  .visivel .escreve, .p3.visivel .nomes{opacity:1; clip-path:inset(0 0 0 0)}
  .cresce{opacity:0; transform:scaleX(0); transition:transform 1s cubic-bezier(.3,0,.2,1), opacity .6s ease}
  .visivel .cresce{opacity:1; transform:none}
  .surge{opacity:0; transform:translateY(12px); transition:opacity 1s ease, transform 1s ease}
  .visivel .surge{opacity:1; transform:none}

  .p2 .l1{left:31.456%;top:21.890%;width:54.835%;height:2.931%; transition-delay:.7s}
  .p2 .l2{left:35.707%;top:24.701%;width:46.546%;height:2.632%; transition-delay:1.45s}
  .p2 .l3{left:29.330%;top:27.572%;width:58.236%;height:2.871%; transition-delay:2.2s}
  .p2 .l4{left:36.982%;top:30.801%;width:41.870%;height:2.811%; transition-delay:2.95s}
  .p2 .div{left:30.606%;top:34.270%;width:49.522%;height:2.392%; transition-delay:3.8s}
  .p2 .ref{left:41.658%;top:36.603%;width:27.630%;height:2.512%; transition-delay:4.4s}

  .p3 .nomes{left:20.191%;top:25.359%;width:66.100%;height:8.792%; clip-path:inset(0 100% 0 0);
    transition:clip-path 2.6s cubic-bezier(.45,.05,.35,1) 1s, opacity .4s ease 1s}
  .p3 .div{left:21.254%;top:33.254%;width:58.448%;height:2.213%; transition-delay:3.4s}
  .p3 .data{left:24.230%;top:35.706%;width:57.386%;height:2.811%; opacity:0; clip-path:inset(0 50% 0 50%); filter:blur(3px);
    transition:clip-path 1.4s cubic-bezier(.3,0,.2,1) 4s, opacity .6s ease 4s, filter 1.4s ease 4s}
  .p3.visivel .data{opacity:1; clip-path:inset(0 0 0 0); filter:none}

  /* brilho dourado passando pelo monograma JR */
  .brilhoJR{position:absolute; left:37.832%; top:5.502%; width:26.355%; height:19.139%; pointer-events:none;
    -webkit-mask:url(assets/p3_mono_mask.png) center/100% 100% no-repeat; mask:url(assets/p3_mono_mask.png) center/100% 100% no-repeat;
    background:linear-gradient(115deg,transparent 38%,rgba(255,244,214,.95) 50%,transparent 62%) no-repeat; background-size:300% 100%;
    background-position:120% 0; mix-blend-mode:screen}
  .visivel .brilhoJR{animation:reluz 6s ease-in-out 1.6s infinite}
  @keyframes reluz{0%{background-position:120% 0}30%,100%{background-position:-20% 0}}
  .faisca{position:absolute; width:1.6%; aspect-ratio:1; pointer-events:none; opacity:0;
    background:radial-gradient(circle,#fff6dc 0%,#e8c27a 35%,transparent 70%); clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}
  .visivel .faisca{animation:pisca 3.2s ease-in-out infinite}
  @keyframes pisca{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}

  /* efeitos genéricos extras */
  .mao{opacity:0; clip-path:inset(0 100% 0 0); transition:clip-path 2.4s cubic-bezier(.45,.05,.35,1), opacity .4s ease}
  .visivel .mao{opacity:1; clip-path:inset(0 0 0 0)}
  .abre{opacity:0; clip-path:inset(0 50% 0 50%); filter:blur(3px); transition:clip-path 1.4s cubic-bezier(.3,0,.2,1), opacity .6s ease, filter 1.4s ease}
  .visivel .abre{opacity:1; clip-path:inset(0 0 0 0); filter:none}

  /* Página 4 · Convite */
  .p4 .juntos{left:31.456%;top:23.206%;width:36.982%;height:1.794%; transition-delay:.6s}
  .p4 .div1{left:32.944%;top:25.179%;width:34.006%;height:1.794%; transition-delay:1s}
  .p4 .nomes{left:18.278%;top:26.734%;width:67.375%;height:8.134%; transition-delay:1.3s}
  .p4 .convidam{left:15.197%;top:35.586%;width:69.819%;height:2.333%; transition-delay:3.5s}
  .p4 .div2{left:16.472%;top:78.230%;width:66.419%;height:1.794%; transition-delay:4.1s}
  .p4 .data{left:18.916%;top:80.502%;width:62.062%;height:2.452%; transition-delay:4.5s}
  .p4 .pres1{left:22.742%;top:84.211%;width:54.623%;height:2.213%; transition-delay:5.3s}
  .p4 .pres2{left:32.094%;top:86.603%;width:35.707%;height:1.734%; transition-delay:6s}
  .p4 .brilhoJR{left:36.663%;top:2.691%;width:27.630%;height:19.438%;
    -webkit-mask-image:url(assets/p4_mono_mask.png); mask-image:url(assets/p4_mono_mask.png)}

  /* navegação: pontinhos + dica */
  #nav{position:fixed; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:15;
    display:none; gap:8px; align-items:center}
  body.entrou #nav{display:flex}
  #nav i{width:7px; height:7px; border-radius:50%; background:rgba(184,134,59,.35); transition:all .4s}
  #nav i.on{background:var(--ouro); width:18px; border-radius:4px}
  #dica{position:fixed; right:10px; top:50%; transform:translateY(-50%); z-index:15; color:var(--ouro);
    display:none; flex-direction:column; align-items:center; gap:4px; font-size:11px; letter-spacing:.2em; text-transform:uppercase;
    background:rgba(251,244,234,.75); padding:10px 6px; border-radius:20px; backdrop-filter:blur(3px); pointer-events:none;
    transition:opacity .6s}
  body.entrou #dica{display:flex; animation:aparece .8s ease 4.5s both}
  body.entrou #dica.some{display:none}
  #dica svg{width:22px; height:22px; animation:lado 1.6s ease-in-out infinite}
  @keyframes lado{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
  @keyframes aparece{from{opacity:0}to{opacity:1}}

  /* ---------- Botão de música ---------- */
  #som{
    position:fixed; right:16px; bottom:16px; z-index:30; width:46px; height:46px; border-radius:50%;
    border:1px solid rgba(184,134,59,.6); background:rgba(251,244,234,.92); color:var(--marsala);
    display:none; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 4px 12px rgba(90,59,50,.18); backdrop-filter:blur(4px);
  }
  body.entrou #som{display:flex}
  #som svg{width:20px;height:20px}
  #som .barras{display:flex;gap:3px;align-items:flex-end;height:16px}
  #som .barras b{width:3px;background:var(--marsala);border-radius:2px;animation:eq 1s ease-in-out infinite}
  #som .barras b:nth-child(2){animation-delay:.2s}#som .barras b:nth-child(3){animation-delay:.4s}
  #som.mudo .barras{display:none} #som:not(.mudo) svg{display:none}

      @keyframes onda{0%{transform:translate(-50%,-50%) scale(.75);opacity:.9}100%{transform:translate(-50%,-50%) scale(1.25);opacity:0}}
  @keyframes eq{0%,100%{height:4px}50%{height:16px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  <!-- Abertura: a própria capa do convite. O toque libera a música (regra dos celulares) -->
  <section id="abertura" role="button" aria-label="Abrir convite" tabindex="0">
    <div class="carta">
      <img class="base"   src="assets/base.webp"   alt="Convite de casamento Jéssica e Rônei">
      <img class="aba"    src="assets/aba.webp"    alt="">
      <span class="brilho"></span>
      <img class="selo"   src="assets/selo.webp"   alt="">
      <img class="clique" src="assets/clique.webp" alt="">
    </div>
  </section>

  <main id="paginas"><div id="livro">

    <!-- Página 2 · Mateus 19:6 -->
    <section class="pagina p2" id="versiculo" data-density="soft">
      <div class="quadro">
        <img class="fundo" src="assets/p2_base.webp" alt="Jéssica e Rônei abraçados. Assim, eles já não são dois, mas sim uma só carne. Portanto, ninguém separe o que Deus uniu. Mateus 19:6">
        <img class="escreve l1" src="assets/p2_l1.webp" alt="">
        <img class="escreve l2" src="assets/p2_l2.webp" alt="">
        <img class="escreve l3" src="assets/p2_l3.webp" alt="">
        <img class="escreve l4" src="assets/p2_l4.webp" alt="">
        <img class="cresce div" src="assets/p2_div.webp" alt="">
        <img class="surge ref" src="assets/p2_ref.webp" alt="">
      </div>
    </section>

    <!-- Página 3 · Data -->
    <section class="pagina p3" id="data" data-density="soft">
      <div class="quadro">
        <img class="fundo" src="assets/p3_base.webp" alt="Monograma JR. Jéssica e Rônei, 12 de fevereiro de 2027">
        <span class="brilhoJR"></span>
        <span class="faisca" style="left:36%;top:7%;animation-delay:2s"></span>
        <span class="faisca" style="left:63%;top:11%;animation-delay:2.9s"></span>
        <span class="faisca" style="left:61%;top:22%;animation-delay:3.6s"></span>
        <span class="faisca" style="left:38%;top:19%;animation-delay:4.4s"></span>
        <img class="nomes" src="assets/p3_nomes.webp" alt="">
        <img class="cresce div" src="assets/p3_div.webp" alt="">
        <img class="data" src="assets/p3_data.webp" alt="">
      </div>
    </section>

    <!-- Página 4 · Convite -->
    <section class="pagina p4" id="convite" data-density="soft">
      <div class="quadro">
        <img class="fundo" src="assets/p4_base.webp" alt="Juntos, para sempre. Jéssica e Rônei convidam você para o nosso casamento. 12 de fevereiro de 2027. Sua presença tornará este dia ainda mais especial.">
        <span class="brilhoJR"></span>
        <span class="faisca" style="left:35%;top:4%;animation-delay:1.8s"></span>
        <span class="faisca" style="left:63%;top:8%;animation-delay:2.7s"></span>
        <span class="faisca" style="left:62%;top:19%;animation-delay:3.5s"></span>
        <span class="faisca" style="left:36%;top:16%;animation-delay:4.3s"></span>
        <img class="surge juntos" src="assets/p4_juntos.webp" alt="">
        <img class="cresce div1" src="assets/p4_div1.webp" alt="">
        <img class="mao nomes" src="assets/p4_nomes.webp" alt="">
        <img class="surge convidam" src="assets/p4_convidam.webp" alt="">
        <img class="cresce div2" src="assets/p4_div2.webp" alt="">
        <img class="abre data" src="assets/p4_data.webp" alt="">
        <img class="escreve pres1" src="assets/p4_pres1.webp" alt="">
        <img class="escreve pres2" src="assets/p4_pres2.webp" alt="">
      </div>
    </section>

  </div></main>

  <nav id="nav" aria-label="Páginas"></nav>
  <div id="dica" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>vire</div>

  <button id="som" aria-label="Pausar ou tocar música">
    <span class="barras"><b></b><b></b><b></b></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
  </button>

  <script src="assets/vendor/page-flip.browser.js"></script>
  <audio id="musica" src="assets/musica.mp3" loop preload="auto"></audio>

<script>
  const audio = document.getElementById('musica');
  const som = document.getElementById('som');

  // Começa a baixar a música logo que a página abre e no primeiro toque na tela
  audio.load();
  document.addEventListener('touchstart', ()=>{ if(audio.readyState === 0 && audio.networkState !== 2) audio.load(); }, {once:true, passive:true});

  function fadeIn(){
    audio.volume = 0.45; let v = 0.45;
    const t = setInterval(()=>{ v += 0.08; audio.volume = Math.min(v, 0.85); if(v >= 0.85) clearInterval(t); }, 80);
  }

  const abertura = document.getElementById('abertura');
  let aberto = false;
  function abrir(){
    if(aberto) return; aberto = true;
    fadeIn(); audio.play().catch(()=> som.classList.add('mudo'));
    abertura.classList.add('abrindo');
    setTimeout(()=>{ abertura.classList.add('fim'); document.body.classList.add('entrou'); observarPaginas(); }, 2050);
  }
  // ---------- Virar páginas como folha de papel (StPageFlip, MIT) ----------
  const paginas = [...document.querySelectorAll('.pagina')];
  const nav = document.getElementById('nav'), dica = document.getElementById('dica');
  paginas.forEach((p,i)=>{ nav.appendChild(document.createElement('i')); if(i>0) p.classList.add('pronta'); });
  function marcar(n){ [...nav.children].forEach((d,i)=>d.classList.toggle('on', i===n)); }

  const vw = window.innerWidth, vh = window.innerHeight;
  const pw = Math.floor(Math.min(vw, vh * 941 / 1672)), ph = Math.floor(pw * 1672 / 941);
  const livro = new St.PageFlip(document.getElementById('livro'), {
    width: pw, height: ph, size: 'fixed', usePortrait: true, showCover: false,
    drawShadow: true, maxShadowOpacity: 0.45, flippingTime: 1100,
    mobileScrollSupport: false, swipeDistance: 25, showPageCorners: true, startZIndex: 0
  });
  livro.loadFromHTML(paginas);
  livro.on('flip', e=>{
    const n = e.data; paginas[n].classList.add('visivel'); marcar(n); dica.classList.add('some');
  });
  function observarPaginas(){ paginas[0].classList.add('visivel'); marcar(0); }

  // Toque rápido também vira (a biblioteca só vira com deslizar ou segurar)
  const elLivro = document.getElementById('livro'); let t0 = null;
  elLivro.addEventListener('touchstart', e=>{ const t=e.changedTouches[0]; t0 = {x:t.clientX, y:t.clientY, time:Date.now()}; }, {passive:true, capture:true});
  elLivro.addEventListener('touchend', e=>{
    if(!t0) return; const t=e.changedTouches[0];
    const rapido = Date.now()-t0.time < 240, parado = Math.hypot(t.clientX-t0.x, t.clientY-t0.y) < 12;
    if(rapido && parado && livro.getState()==='read'){
      const r = elLivro.getBoundingClientRect(), canto = (t.clientY - r.top) > r.height/2 ? 'bottom' : 'top';
      (t.clientX - r.left) < r.width*0.3 ? livro.flipPrev(canto) : livro.flipNext(canto);
    }
    t0 = null;
  }, {capture:true});
  document.addEventListener('keydown', e=>{
    if(!document.body.classList.contains('entrou')) return;
    if(e.key==='ArrowRight') livro.flipNext(); if(e.key==='ArrowLeft') livro.flipPrev();
  });

  abertura.addEventListener('click', abrir);
  abertura.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') abrir(); });

  som.addEventListener('click', ()=>{
    if(audio.paused){ audio.play().then(fadeIn).catch(()=>{}); som.classList.remove('mudo'); }
    else { audio.pause(); som.classList.add('mudo'); }
  });

  // Pausa quando o convidado sai da aba e volta a tocar ao retornar
  let pausadoPorSaida = false;
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden && !audio.paused){ audio.pause(); pausadoPorSaida = true; }
    else if(!document.hidden && pausadoPorSaida){ audio.play().catch(()=>{}); pausadoPorSaida = false; }
  });
</script>
</body>
</html>
