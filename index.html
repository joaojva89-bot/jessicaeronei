<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jéssica & Rônei · 12.02.2027</title>
<meta name="description" content="Convite de casamento de Jéssica & Rônei">
<meta name="theme-color" content="#f6ece0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --marsala:#7a1f2b; --ouro:#b8863b; --creme:#f6ece0; --texto:#5a3b32; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at top,#fbf4ea 0%,var(--creme) 60%,#efe0cf 100%);
    color:var(--texto); font-family:'Cormorant Garamond',Georgia,serif;
    min-height:100vh; overflow-x:hidden; -webkit-tap-highlight-color:transparent;
  }

  /* ---------- Abertura: carta com selo ---------- */
  #abertura{
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg,#fbe6d1 0%,#fceee0 50%,#fcefe1 100%);
    overflow:hidden; cursor:pointer; transition:opacity .9s ease .1s, visibility .9s .1s;
  }
  #abertura.fim{opacity:0; visibility:hidden}
  .carta{
    position:relative; width:min(100vw, calc(100svh * 941 / 1671)); aspect-ratio:941/1671;
    perspective:1400px; transform-origin:51% 14%;
    transition:transform 1.3s cubic-bezier(.55,0,.25,1), filter 1.3s ease;
  }
  .carta img{position:absolute; display:block; user-select:none; -webkit-user-drag:none; pointer-events:none}
  .carta .base{inset:0; width:100%; height:100%}
  .carta .aba{left:27.099%; top:0; width:52.816%; height:23.459%; transform-origin:50% 0;
    transition:transform 1.1s cubic-bezier(.45,0,.2,1) .45s, opacity .35s ease 1.15s; filter:drop-shadow(0 4px 6px rgba(90,59,50,.18))}
  .carta .selo{left:40.383%; top:12.567%; width:22.848%; height:12.567%; animation:respira 2.4s ease-in-out infinite}
  .carta .clique{left:41.977%; top:20.467%; width:25.186%; height:5.147%; transition:opacity .35s ease}
  .brilho{position:absolute; left:51.75%; top:18.9%; width:22%; aspect-ratio:1; transform:translate(-50%,-50%);
    border-radius:50%; border:2px solid rgba(214,168,90,.55); animation:onda 2.4s ease-out infinite; pointer-events:none}

  /* sequência ao tocar */
  .abrindo .brilho{display:none}
  .abrindo .clique{opacity:0}
  .abrindo .selo{animation:quebra .75s cubic-bezier(.3,0,.2,1) forwards}
  .abrindo .aba{transform:rotateX(165deg); opacity:0}
  .abrindo .carta{transform:scale(1.9) translateY(6%); filter:blur(1px); transition-delay:1.35s}

  @keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  @keyframes quebra{
    0%{transform:scale(1) rotate(0); opacity:1; filter:brightness(1)}
    25%{transform:scale(1.14) rotate(-4deg); filter:brightness(1.25)}
    100%{transform:scale(.4) rotate(25deg) translateY(60%); opacity:0; filter:brightness(1.1)}
  }

  /* ---------- Conteúdo ---------- */
  main{display:flex; align-items:center; justify-content:center; text-align:center; min-height:100vh; padding:40px 20px}
  .wrap{max-width:420px; width:100%; opacity:0}
  body.entrou .wrap{animation:sobe 1.4s .5s ease-out both}
  .mono{width:78px;height:78px;margin:0 auto 24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%,#ecc883,var(--ouro) 55%,#86591d 100%);font-family:'Great Vibes',cursive;font-size:36px;color:#5b3d12;
    box-shadow:0 6px 16px rgba(122,31,43,.22)}
  h1{font-family:'Great Vibes',cursive;font-weight:400;color:var(--marsala);font-size:clamp(46px,13vw,64px);line-height:1.1}
  .linha{display:flex;align-items:center;gap:12px;margin:18px auto;max-width:280px}
  .linha span{flex:1;height:1px;background:var(--ouro)}
  .linha i{width:9px;height:9px;background:var(--ouro);transform:rotate(45deg)}
  .data{letter-spacing:.32em;font-size:18px;font-weight:600;color:var(--marsala)}
  p.msg{margin-top:22px;font-size:20px;line-height:1.5}
  .emb{margin-top:30px;font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:var(--ouro)}

  /* ---------- Botão de música ---------- */
  #som{
    position:fixed; right:16px; bottom:16px; z-index:30; width:46px; height:46px; border-radius:50%;
    border:1px solid rgba(184,134,59,.6); background:rgba(251,244,234,.92); color:var(--marsala);
    display:none; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 4px 12px rgba(90,59,50,.18); backdrop-filter:blur(4px);
  }
  body.entrou #som{display:flex}
  #som svg{width:20px;height:20px}
  #som .barras{display:flex;gap:3px;align-items:flex-end;height:16px}
  #som .barras b{width:3px;background:var(--marsala);border-radius:2px;animation:eq 1s ease-in-out infinite}
  #som .barras b:nth-child(2){animation-delay:.2s}#som .barras b:nth-child(3){animation-delay:.4s}
  #som.mudo .barras{display:none} #som:not(.mudo) svg{display:none}

  @keyframes sobe{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
    @keyframes onda{0%{transform:translate(-50%,-50%) scale(.75);opacity:.9}100%{transform:translate(-50%,-50%) scale(1.25);opacity:0}}
  @keyframes eq{0%,100%{height:4px}50%{height:16px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.wrap{opacity:1}}
</style>
</head>
<body>

  <!-- Abertura: a própria capa do convite. O toque libera a música (regra dos celulares) -->
  <section id="abertura" role="button" aria-label="Abrir convite" tabindex="0">
    <div class="carta">
      <img class="base"   src="assets/base.webp"   alt="Convite de casamento Jéssica e Rônei">
      <img class="aba"    src="assets/aba.webp"    alt="">
      <span class="brilho"></span>
      <img class="selo"   src="assets/selo.webp"   alt="">
      <img class="clique" src="assets/clique.webp" alt="">
    </div>
  </section>

  <main>
    <div class="wrap">
      <div class="mono">JR</div>
      <h1>Jéssica &amp; Rônei</h1>
      <div class="linha"><span></span><i></i><span></span></div>
      <div class="data">12 · 02 · 2027</div>
      <p class="msg">Estamos preparando cada detalhe deste convite com muito carinho.</p>
      <div class="emb">Em breve</div>
    </div>
  </main>

  <button id="som" aria-label="Pausar ou tocar música">
    <span class="barras"><b></b><b></b><b></b></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
  </button>

  <audio id="musica" src="assets/musica.mp3" loop preload="auto"></audio>

<script>
  const audio = document.getElementById('musica');
  const som = document.getElementById('som');

  // Começa a baixar a música logo que a página abre e no primeiro toque na tela
  audio.load();
  document.addEventListener('touchstart', ()=>{ if(audio.readyState === 0 && audio.networkState !== 2) audio.load(); }, {once:true, passive:true});

  function fadeIn(){
    audio.volume = 0.45; let v = 0.45;
    const t = setInterval(()=>{ v += 0.08; audio.volume = Math.min(v, 0.85); if(v >= 0.85) clearInterval(t); }, 80);
  }

  const abertura = document.getElementById('abertura');
  let aberto = false;
  function abrir(){
    if(aberto) return; aberto = true;
    fadeIn(); audio.play().catch(()=> som.classList.add('mudo'));
    abertura.classList.add('abrindo');
    setTimeout(()=>{ abertura.classList.add('fim'); document.body.classList.add('entrou'); }, 2050);
  }
  abertura.addEventListener('click', abrir);
  abertura.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') abrir(); });

  som.addEventListener('click', ()=>{
    if(audio.paused){ audio.play().then(fadeIn).catch(()=>{}); som.classList.remove('mudo'); }
    else { audio.pause(); som.classList.add('mudo'); }
  });

  // Pausa quando o convidado sai da aba e volta a tocar ao retornar
  let pausadoPorSaida = false;
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden && !audio.paused){ audio.pause(); pausadoPorSaida = true; }
    else if(!document.hidden && pausadoPorSaida){ audio.play().catch(()=>{}); pausadoPorSaida = false; }
  });
</script>
</body>
</html>
